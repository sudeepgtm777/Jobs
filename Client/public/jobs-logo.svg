<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Jobs">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>

  <!-- card background -->
  <rect width="64" height="64" rx="12" fill="url(#bg)"/>

  <!-- soft browser window -->
  <rect x="10" y="12" width="34" height="24" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <circle cx="15" cy="17" r="1.2" fill="#93c5fd"/>
  <circle cx="19" cy="17" r="1.2" fill="#93c5fd"/>
  <circle cx="23" cy="17" r="1.2" fill="#93c5fd"/>
  <rect x="14" y="22" width="10" height="3" rx="1" fill="#bfdbfe"/>
  <rect x="26" y="22" width="10" height="3" rx="1" fill="#bfdbfe"/>
  <rect x="14" y="28" width="22" height="3" rx="1" fill="#dbeafe"/>

  <!-- JOB tags -->
  <rect x="36" y="10" width="16" height="7" rx="3.5" fill="#2563eb"/>
  <text x="44" y="15.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="5" font-weight="700" fill="#ffffff">JOB</text>
  <rect x="40" y="20" width="14" height="6" rx="3" fill="#3b82f6"/>
  <text x="47" y="24.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="4.5" font-weight="700" fill="#ffffff">JOB</text>

  <!-- person at desk -->
  <circle cx="22" cy="40" r="4.5" fill="#1e3a8a"/>
  <path d="M15 52c1.5-6 4.5-9 7-9s5.5 3 7 9" fill="#2563eb"/>
  <rect x="12" y="51" width="24" height="3" rx="1.5" fill="#1e40af"/>
  <rect x="26" y="45" width="10" height="6" rx="1.2" fill="#60a5fa"/>
  <rect x="27.5" y="46" width="7" height="3.5" rx="0.6" fill="#eff6ff"/>

  <!-- magnifying glass -->
  <circle cx="44" cy="42" r="9" fill="none" stroke="#1d4ed8" stroke-width="3"/>
  <circle cx="44" cy="42" r="5.5" fill="#93c5fd" fill-opacity="0.35"/>
  <!-- profile in lens -->
  <circle cx="44" cy="40" r="2.2" fill="#1e3a8a"/>
  <path d="M40.5 46.5c1-2.2 2.2-3.2 3.5-3.2s2.5 1 3.5 3.2" fill="#1e40af"/>
  <line x1="50.5" y1="48.5" x2="56" y2="54" stroke="#1d4ed8" stroke-width="3.2" stroke-linecap="round"/>
</svg>
